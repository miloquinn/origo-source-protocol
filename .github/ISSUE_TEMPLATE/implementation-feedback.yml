name: Implementation feedback
description: Report experience implementing an ORSP reader or source
title: "[Implementation]: "
labels: [feedback]
body:
  - type: dropdown
    id: role
    attributes:
      label: Implementation type
      options:
        - Source server
        - Reader client
        - Adapter gateway
        - Conformance tooling
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language or framework
  - type: textarea
    id: experience
    attributes:
      label: Feedback
      description: What worked, what was ambiguous, and what was missing?
    validations:
      required: true
