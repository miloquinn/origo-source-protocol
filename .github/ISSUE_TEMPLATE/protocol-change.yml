name: Protocol change proposal
description: Propose an addition or compatibility-affecting protocol change
title: "[Protocol]: "
labels: [protocol]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reader or source-developer problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe request paths, fields, semantics, and examples.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Explain how existing v1 clients and sources would behave.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security, privacy, and copyright
      description: Note relevant risks and mitigations.
