openapi: 3.1.0
info:
  title: Open Reading Source Protocol
  version: '1.6'
  description: 'ORSP 1.6 candidate: Core Reading, Discovery and Rankings, with optional
    OEP-0006 image/audio representations. EPUB and chapter updates have separate companion
    OpenAPI documents.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://books.example.org/api
paths:
  /v1/discover:
    get:
      operationId: discoverBooks
      summary: Get curated discovery shelves
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      responses:
        '200':
          description: Curated discovery shelves
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/categories:
    get:
      operationId: listCategories
      summary: List browseable categories
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      responses:
        '200':
          description: Source-defined categories
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/browse:
    get:
      operationId: browseBooks
      summary: Browse books by category or standard sort
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OpaqueId'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - latest
          - popular
          default: latest
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Browse results
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/rankings:
    get:
      operationId: listRankings
      summary: List source-defined ranking resources
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      responses:
        '200':
          description: Available rankings
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingCollection'
        '304':
          $ref: '#/components/responses/NotModified'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/rankings/{rankingId}:
    get:
      operationId: getRanking
      summary: Get one paginated ranking snapshot
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      - $ref: '#/components/parameters/RankingId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Ranking page
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/RankingNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/search:
    get:
      operationId: searchBooks
      summary: Search books
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Search results
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/books/{bookId}:
    get:
      operationId: getBook
      summary: Get book details
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Book details
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/books/{bookId}/chapters:
    get:
      operationId: listChapters
      summary: List a book's chapters
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      - $ref: '#/components/parameters/BookId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/CatalogPageSize'
      responses:
        '200':
          description: Paginated chapter catalog
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/books/{bookId}/chapters/{chapterId}:
    get:
      operationId: getChapterContent
      summary: Get chapter content
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/RequestPurpose'
      - $ref: '#/components/parameters/BookId'
      - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Chapter content
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterContent'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    ProtocolVersion:
      name: X-Open-Reading-Protocol
      in: header
      required: false
      description: Highest ORSP 1.x version supported by the client.
      schema:
        type: string
        pattern: ^1\.(?:0|[1-9][0-9]*)$
    RequestPurpose:
      name: X-Open-Reading-Request-Purpose
      in: header
      required: false
      description: Advisory request purpose. Use health-check for operator probes;
        never use it for authorization or rate-limit bypass.
      schema:
        type: string
        enum:
        - health-check
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CatalogPageSize:
      name: pageSize
      in: query
      required: false
      description: Bounded by the source's declared maxCatalogPageSize discovery member,
        or 100 when that member is absent.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RankingId:
      name: rankingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
  headers:
    ETag:
      description: Entity tag for the selected representation.
      schema:
        type: string
  responses:
    NotModified:
      description: The selected representation has not changed.
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RankingNotFound:
      description: Ranking not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: HTTP method not supported
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            oneOf:
            - type: integer
              minimum: 1
            - type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal source error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Source temporarily unavailable
      headers:
        Retry-After:
          schema:
            oneOf:
            - type: integer
              minimum: 1
            - type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9._~-]+$
    Book:
      type: object
      description: A book scoped to the source serving the response. Multi-source
        clients retain source attribution and do not treat id as globally unique.
      additionalProperties: true
      required:
      - id
      - title
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          minLength: 1
          maxLength: 500
        author:
          type: string
          maxLength: 500
        description:
          type: string
        coverUrl:
          type: string
          format: uri
          pattern: ^https?://
        categories:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        status:
          type: string
          enum:
          - ongoing
          - completed
          - hiatus
          - unknown
        latestChapter:
          type: string
          maxLength: 500
        language:
          type: string
          minLength: 2
          maxLength: 35
          pattern: ^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$
        updatedAt:
          type: string
          format: date-time
        mediaKind:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Known values: text, image-sequence, remote-audio, unknown.
            Unrecognized values map to unknown.'
        type:
          type: integer
          description: 'Optional legacy reader bridge: text 8, image sequence 64,
            remote audio 32.'
    SearchPage:
      type: object
      additionalProperties: true
      required:
      - items
      - page
      - pageSize
      - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    DiscoveryPage:
      type: object
      additionalProperties: true
      required:
      - sections
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverySection'
    DiscoverySection:
      type: object
      description: A curated section scoped to the source serving the response.
      additionalProperties: true
      required:
      - id
      - title
      - items
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          minLength: 1
          maxLength: 200
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Book'
    CategoryPage:
      type: object
      additionalProperties: true
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Category:
      type: object
      description: A browse category scoped to the source serving the response. Equal
        ids or names from different sources do not identify the same category.
      additionalProperties: true
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 200
    RankingCollection:
      type: object
      additionalProperties: true
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Ranking'
    Ranking:
      type: object
      description: A named ranking scoped to the source serving the response.
      additionalProperties: true
      required:
      - id
      - title
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        period:
          type: string
          enum:
          - realtime
          - daily
          - weekly
          - monthly
          - all-time
        categoryId:
          $ref: '#/components/schemas/OpaqueId'
    RankingPage:
      type: object
      additionalProperties: true
      required:
      - ranking
      - snapshotId
      - items
      - page
      - pageSize
      - hasMore
      properties:
        ranking:
          $ref: '#/components/schemas/Ranking'
        snapshotId:
          $ref: '#/components/schemas/OpaqueId'
        snapshotAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/RankingEntry'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    RankingEntry:
      type: object
      additionalProperties: true
      required:
      - rank
      - book
      properties:
        rank:
          type: integer
          minimum: 1
        previousRank:
          type: integer
          minimum: 1
        score:
          type: number
        scoreLabel:
          type: string
          maxLength: 100
        book:
          $ref: '#/components/schemas/Book'
    Chapter:
      type: object
      additionalProperties: true
      required:
      - id
      - title
      - order
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          minLength: 1
          maxLength: 500
        order:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    ChapterPage:
      type: object
      additionalProperties: true
      required:
      - items
      - page
      - pageSize
      - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 1000
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    ChapterContent:
      description: Core text, or explicitly advertised OEP-0006 media representations.
      oneOf:
      - $ref: '#/components/schemas/TextChapterContent'
      - $ref: '#/components/schemas/ImageChapterContent'
      - $ref: '#/components/schemas/AudioChapterContent'
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: true
          required:
          - code
          - message
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$
              description: 'Standard ORSP codes: INVALID_PARAMETER, BOOK_NOT_FOUND,
                CHAPTER_NOT_FOUND, RANKING_NOT_FOUND, ROUTE_NOT_FOUND, METHOD_NOT_ALLOWED,
                RATE_LIMITED, INTERNAL_ERROR, UNAVAILABLE. Source-defined codes must
                use the X_ prefix. Clients ignore unknown codes.'
            message:
              type: string
              minLength: 1
            retryable:
              type: boolean
            requestId:
              type: string
              minLength: 1
              maxLength: 200
    TextChapterContent:
      type: object
      additionalProperties: true
      required:
      - bookId
      - chapterId
      - title
      - contentType
      - content
      properties:
        bookId:
          $ref: '#/components/schemas/OpaqueId'
        chapterId:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          minLength: 1
          maxLength: 500
        contentType:
          type: string
          enum:
          - text/plain
          - text/markdown
          - text/html
        content:
          type: string
        baseUrl:
          type: string
          format: uri
          pattern: ^https?://
    MediaHttpUrl:
      type: string
      format: uri
      pattern: ^https?://[^/?#@\s]+(?:[/?#][^\s]*)?$
    MediaHeaders:
      type: object
      additionalProperties: false
      properties:
        Referer:
          $ref: '#/components/schemas/MediaHttpUrl'
        Origin:
          type: string
          format: uri
          pattern: ^https?://[^/?#@\s]+/?$
        Accept:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[\x20-\x7e]+$
    MediaImage:
      type: object
      required:
      - url
      properties:
        url:
          $ref: '#/components/schemas/MediaHttpUrl'
        headers:
          $ref: '#/components/schemas/MediaHeaders'
        mimeType:
          type: string
          pattern: ^image/[a-zA-Z0-9.+-]+$
        width:
          type: integer
          minimum: 1
          maximum: 32768
        height:
          type: integer
          minimum: 1
          maximum: 32768
        alt:
          type: string
          maxLength: 2000
        expiresAt:
          type: string
          format: date-time
    MediaAudio:
      type: object
      required:
      - url
      properties:
        url:
          $ref: '#/components/schemas/MediaHttpUrl'
        headers:
          $ref: '#/components/schemas/MediaHeaders'
        mimeType:
          type: string
          minLength: 3
          maxLength: 100
          pattern: ^[a-z0-9.+-]+/[a-z0-9.+-]+$
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 315360000
        transport:
          enum:
          - file
          - hls
        expiresAt:
          type: string
          format: date-time
    ImageChapterContent:
      type: object
      required:
      - bookId
      - chapterId
      - title
      - contentType
      - content
      - images
      properties:
        bookId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9._~-]+$
        chapterId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9._~-]+$
        title:
          type: string
          minLength: 1
          maxLength: 500
        contentType:
          const: image/sequence
        content:
          const: ''
        images:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: '#/components/schemas/MediaImage'
        audio: false
        contentVersion:
          type: string
          pattern: ^[a-f0-9]{64}$
    AudioChapterContent:
      type: object
      required:
      - bookId
      - chapterId
      - title
      - contentType
      - content
      - audio
      properties:
        bookId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9._~-]+$
        chapterId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9._~-]+$
        title:
          type: string
          minLength: 1
          maxLength: 500
        contentType:
          const: audio/uri
        content:
          const: ''
        audio:
          $ref: '#/components/schemas/MediaAudio'
        images: false
        contentVersion:
          type: string
          pattern: ^[a-f0-9]{64}$
